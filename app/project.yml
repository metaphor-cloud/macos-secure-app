# Secure App for macOS. The .xcodeproj is generated from this file and
# committed, so building needs only Xcode:
#   cd app && xcodegen generate
# Build and test: app/scripts/build.sh (see docs/NEW-APP.md).
name: SecureApp
options:
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en-NZ
settings:
  base:
    DEVELOPMENT_TEAM: TEAMID1234
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
targets:
  SecureAppKit:
    type: framework
    platform: macOS
    sources:
      - path: SecureAppKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.secureapp.kit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
  SecureApp:
    type: application
    platform: macOS
    sources:
      - path: SecureApp
        excludes:
          - "**/*.entitlements"
    dependencies:
      - target: SecureAppKit
      - sdk: DeviceCheck.framework
      - sdk: WebKit.framework
      - sdk: LocalAuthentication.framework
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_NAME: Secure App
        PRODUCT_MODULE_NAME: SecureApp
        PRODUCT_BUNDLE_IDENTIFIER: com.example.secureapp
        INFOPLIST_FILE: SecureApp/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: SecureApp/SecureApp.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: SecureApp/SecureApp.entitlements
    preBuildScripts:
      - name: Bundle the web app
        script: '"${SRCROOT}/scripts/copy-spa-bundle.sh"'
        basedOnDependencyAnalysis: false
  SecureAppKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SecureAppKitTests
    dependencies:
      - target: SecureAppKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.secureapp.kit.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SecureApp:
    build:
      targets:
        SecureApp: all
        SecureAppKit: all
    test:
      targets:
        - SecureAppKitTests
      gatherCoverageData: false
  SecureAppKit:
    build:
      targets:
        SecureAppKit: all
    test:
      targets:
        - SecureAppKitTests
